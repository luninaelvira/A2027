<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Интерактив: Борьба с инвазивными видами</title>
    <style>
        :root {
            --peach: #ffe5d9;
            --mint: #d8f3dc;
            --lavender: #e8e3f5;
            --cream: #fefae0;
            --bg: #f4f1de;
            --text: #3d405b;
            --error-red: #e07a5f;
            --shadow-color: rgba(0,0,0,0.08);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
        }

        h1 { margin-bottom: 5px; text-align: center; color: #2d3e50;}
        .subtitle { margin-bottom: 30px; color: #666; text-align: center; }

        .game-wrapper {
            width: 100%;
            max-width: 1200px;
        }

        .game-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
            width: 100%;
        }

        /* Карточка растения */
        .plant-card {
            background: white;
            border-radius: 20px;
            padding: 20px 20px 25px;
            width: 220px;
            box-shadow: 0 10px 20px var(--shadow-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 2px solid transparent;
            transition: border-color 0.3s, transform 0.2s;
            position: relative;
        }

        /* Зона, куда нужно перетащить */
        .drop-zone {
            width: 100%;
            height: 180px; 
            background-color: #e8eaed;
            border-radius: 12px;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s;
            position: relative;
            margin-bottom: 15px;
            border: 2px dashed #b0b8c1;
        }

        /* Анимация исчезновения при победе */
        .drop-zone.victory {
            opacity: 0;
            transform: scale(0.3) rotate(10deg);
            pointer-events: none;
            border: none;
        }

        /* Пульсация при ошибке (на всей карточке) */
        .plant-card.error-pulse {
            animation: pulseError 0.5s ease 2;
            border-color: var(--error-red);
        }

        @keyframes pulseError {
            0% { transform: scale(1); background-color: white; }
            50% { transform: scale(1.02); background-color: var(--peach); }
            100% { transform: scale(1); background-color: white; }
        }

        .plant-name { font-weight: bold; font-size: 16px; text-align: center; color: #333; }

        /* Панель инструментов */
        .tools-panel {
            background: var(--cream);
            padding: 20px 25px;
            border-radius: 30px;
            width: 100%;
            margin-top: 40px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            box-shadow: 0 4px 15px var(--shadow-color);
            min-height: 80px;
            box-sizing: border-box;
        }

        /* Перетаскиваемый элемент */
        .tool-item {
            background: white;
            padding: 12px 22px;
            border-radius: 30px;
            cursor: grab;
            border: 2px solid var(--lavender);
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
            font-size: 14px;
            font-weight: 600;
            color: #3d405b;
            transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
            display: inline-block;
        }

        .tool-item:active {
            cursor: grabbing;
            transform: scale(0.95);
            border-color: #888;
        }

        .tool-item:hover {
            transform: translateY(-3px);
            border-color: var(--mint);
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
        }

        /* Правильный инструмент блокируется после победы */
        .tool-item.solved {
            opacity: 0.5;
            pointer-events: none;
            cursor: default;
            border-color: #ccc;
            background: #f0f0f0;
        }

        /* Призрак (летит за курсором) */
        .drag-ghost {
            position: fixed;
            pointer-events: none;
            background: white;
            padding: 12px 22px;
            border-radius: 30px;
            border: 2px solid #4a5568;
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
            font-size: 14px;
            font-weight: 600;
            z-index: 1000;
            transform: translate(-50%, -50%);
            opacity: 0.95;
            color: #3d405b;
        }

        /* Уведомления */
        .notification-area {
            margin-top: 25px;
            padding: 18px 25px;
            border-radius: 20px;
            max-width: 800px;
            width: 100%;
            text-align: center;
            background: var(--lavender);
            display: none;
            font-weight: 500;
            line-height: 1.5;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .notification-area.success { background: var(--mint); color: #1b4332; border: 1px solid #95d5b2; }
        .notification-area.error { background: var(--peach); color: #7f2d1a; border: 1px solid #f4a261; }

    </style>
</head>
<body>

    <div class="game-wrapper">
        <h1>🌿 Перетащи правильный метод борьбы</h1>
        <div class="subtitle">Зажми инструмент мышкой и перетащи его прямо на картинку с растением. <br>Ошибаться можно сколько угодно — инструменты не пропадают!</div>

        <div class="game-container" id="gameContainer"></div>
        <div class="notification-area" id="notificationArea"></div>
        <div class="tools-panel" id="toolsPanel"></div>
    </div>

    <script>
        // === БАЗА ДАННЫХ ===
        const plantData = [
            {
                id: 'borschevik',
                name: 'Борщевик Сосновского',
                imagePath: 'Борщевик Сосновского.png',
                correctTool: 'Гербицид (глифосат)',
                successText: '✅ Отлично! Гербицид проникает через листья и стебель, распределяется по всему растению и уничтожает корневую систему. Это единственный способ убить корень.',
                wrongComments: {
                    'Серп': '❌ Простое скашивание лишь ослабляет растение, но не убивает корень. Он отрастет снова!',
                    'Соль с уксусом': '❌ Народные средства убивают только надземную часть, а мощный корень выживает в земле.',
                    'Чёрная плёнка': '❌ Укрытие работает, но требует целого сезона, а острые остатки стеблей могут прорвать материал.'
                }
            },
            {
                id: 'elodea',
                name: 'Элодея канадская',
                imagePath: 'Элодея канадская.png',
                correctTool: 'Грабли (ручное удаление)',
                successText: '✅ Верно! Полное ручное удаление граблями или спецмашинами — ключевой метод. Нужно убрать растение целиком, включая придонную часть.',
                wrongComments: {
                    'Серп': '❌ Механическая срезка под водой стимулирует рост: из каждого оторванного фрагмента вырастет новое растение!',
                    'Насос (понижение уровня воды)': '❌ Понижение уровня часто неэффективно: при повторном затоплении элодея быстро восстанавливается.',
                    'Гербицид (глифосат)': '❌ Химия токсична для водной экосистемы, сейчас её применяют ограниченно из-за вреда для рыб.'
                }
            },
            {
                id: 'klen',
                name: 'Клён ясенелистный',
                imagePath: 'Клён ясенелистный.png',
                correctTool: 'Пила + Гербицид (на срез)',
                successText: '✅ Правильно! Обработка свежего спила системным гербицидом уничтожает корень и предотвращает появление обильной поросли.',
                wrongComments: {
                    'Пила': '❌ Простое спиливание почти всегда приводит к тому, что из пня пойдет новая поросль.',
                    'Экскаватор': '❌ Механическое выкапывание трудоемко, а из-за мощной корневой системы полностью извлечь все корни почти невозможно.',
                    'Соль с гвоздями': '❌ Народные методы работают слабо и могут засолить почву.'
                }
            },
            {
                id: 'lupin',
                name: 'Люпин многолистный',
                imagePath: 'Люпин многолистный.png',
                correctTool: 'Триммер бензиновый (кошение)',
                successText: '✅ Молодец! Кошение с металлическим ножом расщепляет корневища, изолирует почки возобновления и приводит к гибели растения.',
                wrongComments: {
                    'Серп': '❌ Обычное скашивание лишь срезает надземную часть. Корневища остаются целыми, и люпин быстро восстанавливается.',
                    'Лопата (перекопка)': '❌ Перекопка часто лишь размельчает корни, из которых потом вырастают новые побеги.',
                    'Гербицид (глифосат)': '❌ Гербициды возможны, но их применяют как крайнюю меру. Триммер намного экологичнее!'
                }
            }
        ];

        const allTools = [
            'Серп', 'Гербицид (глифосат)', 'Соль с уксусом', 'Чёрная плёнка', 
            'Грабли (ручное удаление)', 'Насос (понижение уровня воды)', 'Пила', 
            'Пила + Гербицид (на срез)', 'Экскаватор', 'Соль с гвоздями', 
            'Триммер бензиновый (кошение)', 'Лопата (перекопка)'
        ];

        const gameContainer = document.getElementById('gameContainer');
        const toolsPanel = document.getElementById('toolsPanel');
        const notificationArea = document.getElementById('notificationArea');

        let ghost = null;
        let activeToolName = null;
        let activeToolElement = null;

        // === ИНИЦИАЛИЗАЦИЯ ===
        function initGame() {
            // 1. Генерация карточек
            plantData.forEach(plant => {
                const card = document.createElement('div');
                card.className = 'plant-card';
                card.id = `card-${plant.id}`;
                
                card.innerHTML = `
                    <div class="drop-zone" id="zone-${plant.id}" style="background-image: url('${plant.imagePath}');"></div>
                    <div class="plant-name">${plant.name}</div>
                `;
                gameContainer.appendChild(card);
            });

            // 2. Генерация инструментов
            const shuffledTools = [...allTools].sort(() => Math.random() - 0.5);
            shuffledTools.forEach(toolName => {
                const toolBtn = document.createElement('div');
                toolBtn.className = 'tool-item';
                toolBtn.dataset.toolName = toolName;
                toolBtn.innerText = toolName;
                toolBtn.draggable = false;
                
                toolBtn.addEventListener('mousedown', onToolMouseDown);
                toolsPanel.appendChild(toolBtn);
            });
        }

        // === ЛОГИКА DRAG & DROP ===
        function onToolMouseDown(e) {
            // Если инструмент заблокирован (уже использован верно), не даем тащить
            if (e.target.classList.contains('solved')) return;
            
            activeToolElement = e.target;
            activeToolName = activeToolElement.dataset.toolName;

            ghost = activeToolElement.cloneNode(true);
            ghost.className = 'drag-ghost';
            document.body.appendChild(ghost);
            moveGhost(e.clientX, e.clientY);

            document.addEventListener('mousemove', onMouseMove);
            document.addEventListener('mouseup', onMouseUp);
        }

        function onMouseMove(e) {
            if (ghost) moveGhost(e.clientX, e.clientY);
        }

        function moveGhost(x, y) {
            ghost.style.left = x + 'px';
            ghost.style.top = y + 'px';
        }

        function onMouseUp(e) {
            if (!ghost) return;

            ghost.remove();
            ghost = null;
            document.removeEventListener('mousemove', onMouseMove);
            document.removeEventListener('mouseup', onMouseUp);

            // Проверяем, отпустили ли мышь над зоной сброса
            const dropZones = document.querySelectorAll('.drop-zone');
            let targetZone = null;
            let targetPlantId = null;

            dropZones.forEach(zone => {
                const rect = zone.getBoundingClientRect();
                if (e.clientX >= rect.left && e.clientX <= rect.right &&
                    e.clientY >= rect.top && e.clientY <= rect.bottom) {
                    targetZone = zone;
                    targetPlantId = zone.id.replace('zone-', '');
                }
            });

            // Если сбросили на карточку растения
            if (targetZone && targetPlantId && activeToolElement) {
                handleDrop(targetPlantId, activeToolName, activeToolElement);
            }
            
            activeToolElement = null;
            activeToolName = null;
        }

        // === ЛОГИКА ПРОВЕРКИ ===
        function handleDrop(plantId, toolName, toolElement) {
            const plant = plantData.find(p => p.id === plantId);
            const cardElement = document.getElementById(`card-${plantId}`);
            const zoneElement = document.getElementById(`zone-${plantId}`);

            // Если растение уже уничтожено, игнорируем
            if (cardElement.classList.contains('solved')) return;

            if (toolName === plant.correctTool) {
                // === ПОБЕДА ===
                cardElement.classList.add('solved');
                zoneElement.classList.add('victory'); // Картинка красиво исчезает
                
                // Блокируем именно этот инструмент (чтобы нельзя было применить повторно)
                toolElement.classList.add('solved');
                
                showNotification(plant.successText, "success");
            } else {
                // === ОШИБКА ===
                // Пульсирует вся карточка
                cardElement.classList.remove('error-pulse');
                void cardElement.offsetWidth; // Перезапуск анимации
                cardElement.classList.add('error-pulse');

                // Инструмент НЕ ИСЧЕЗАЕТ, а просто возвращается на место (мы ничего с ним не делаем)

                // Достаем комментарий
                const comment = plant.wrongComments[toolName] || "Этот метод абсолютно не эффективен против данного вида.";
                showNotification(comment, "error");
            }
        }

        // === УВЕДОМЛЕНИЯ ===
        function showNotification(text, type) {
            notificationArea.style.display = 'block';
            notificationArea.className = `notification-area ${type}`;
            notificationArea.innerText = text;
            
            clearTimeout(window.notificationTimeout);
            window.notificationTimeout = setTimeout(() => {
                notificationArea.style.display = 'none';
            }, 7000);
        }

        initGame();
    </script>
</body>
</html>
